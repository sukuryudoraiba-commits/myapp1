<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff6fae">
  <title>カードクローゼット</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>カードクローゼット</h1>
  </header>

  <main id="view" aria-live="polite"></main>

  <button id="fab" class="fab" data-action="new-card" aria-label="カードを追加">＋</button>

  <nav class="tabbar" aria-label="メニュー">
    <button data-tab="home" class="active"><span>🏠</span>ホーム</button>
    <button data-tab="cards"><span>🃏</span>カード</button>
    <button data-tab="wish"><span>💖</span>欲しい</button>
    <button data-tab="dupes"><span>🔁</span>ダブり</button>
    <button data-tab="settings"><span>⚙️</span>設定</button>
  </nav>

  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
